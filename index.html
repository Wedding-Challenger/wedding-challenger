    <!-- Google Consent Mode v2: 다른 Google 태그보다 먼저 실행돼야 함. 기본값 denied. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied'
      });
      // 재방문자: 저장된 동의(src/lib/consent.js STORAGE_KEY 'wc-consent')를 광고 스크립트 로드 전에 반영
      try {
        if (JSON.parse(localStorage.getItem('wc-consent') || '{}').ads === true) {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
            analytics_storage: 'granted'
          });
        }
      } catch (e) {}
    </script>
